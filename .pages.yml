media:
  input: assets/uploads
  output: /assets/uploads

content:
  - name: annonces
    label: Annonces
    type: file
    path: _data/annonces.yml
    fields:
      - name: liste
        label: "Annonces en cours — elles disparaissent seules à leur date de fin"
        type: object
        list: true
        fields:
          - name: texte
            label: "Texte de l'annonce"
            type: string
            required: true
          - name: etablissement
            label: Établissement concerné
            type: select
            required: true
            options:
              values:
                - Toutes sections
                - École maternelle Lakanal
                - École élémentaire Lakanal
                - Collège Fermat
                - Collège Michelet
                - Collège Les Chalets
                - Lycée Fermat
          - name: jusquau
            label: "Afficher jusqu'au (inclus)"
            type: date
            required: true
            options:
              format: yyyy-MM-dd
          - name: lien
            label: "Lien (facultatif) — adresse complète, ou /actualites/…"
            type: string
          - name: lien_label
            label: "Texte du lien (facultatif — par défaut « En savoir plus »)"
            type: string

  - name: actualites
    label: Actualités
    type: collection
    path: _posts
    filename: '{year}-{month}-{day}-{fields.slug}.md'
    view:
      fields:
        - title
        - date
    fields:
      - name: title
        label: Titre
        type: string
        required: true
      - name: date
        label: Date
        type: date
        required: true
        options:
          format: yyyy-MM-dd
      - name: slug
        label: "Identifiant pour l'adresse (minuscules, tirets, sans accent)"
        type: string
        required: true
      - name: etablissement
        label: Établissement concerné
        type: select
        required: true
        options:
          values:
            - Toutes sections
            - École maternelle Lakanal
            - École élémentaire Lakanal
            - Collège Fermat
            - Collège Michelet
            - Collège Les Chalets
            - Lycée Fermat
      - name: tag
        label: "Thème (facultatif — ex. Travaux, Cantine, Vente)"
        type: string
      - name: thumbnail
        label: Image principale (facultatif)
        type: image
      - name: summary
        label: "Résumé (affiché sur la page d'accueil)"
        type: text
      - name: attachments
        label: "Fichiers joints (PDF…)"
        type: object
        list: true
        fields:
          - name: file
            label: Fichier
            type: file
          - name: label
            label: Nom affiché
            type: string
      - name: body
        label: "Contenu de l'article"
        type: rich-text
        body: true
